# template values get replaced on makepkg.conf generation
# $level$ -> march x86-64 level, e.g. v3
# $march$ -> full march, e.g. x86-64-v3
# $buildproc$ -> number of threads to build with

common:
  cflags:
    - "-mtune=generic": ~
    - "-O2": "-O3"
    - "-march=x86-64": "-march=$march$"

  options:
    - "lto": "!lto" # disable lto; see 'lto' section below

  buildenv:
    - "color": "!color" # color messes up the log output

  goamd64: "$level$" # https://somegit.dev/ALHP/ALHP.GO/issues/116
  packager: "ALHP $march$ <alhp@harting.dev>"
  makeflags: "-j$buildproc$"
  # https://somegit.dev/ALHP/ALHP.GO/issues/110
  rustflags:
    - "-Copt-level=3"
    - "-Ctarget-cpu=$march$"
    - "-Clink-arg=-z"
    - "-Clink-arg=pack-relative-relocs"
  ltoflags:
    - "-falign-functions=32" # https://github.com/InBetweenNames/gentooLTO/issues/164
  kcflags: " -march=$march$ -O3"
  kcppflags: " -march=$march$ -O3"
  fcflags: "$FFLAGS"
  fflags:
    - "-O2": "-O3"
    - "-march=$march$"

lto:
  rustflags:
    - "-Ccodegen-units=1"

  options:
    - "!lto": "lto"

  cargo_profile_release_lto: "fat"

# per-march sections get applied on top of common, landing in both the lto and
# the non-lto makepkg.conf. keyed by the full march.
#
# PCLMULQDQ is part of no x86-64 feature level, and x86-64-v2's baseline is
# Nehalem, which predates the instruction. enabling it for v2 ships packages that
# SIGILL on CPUs the dynamic linker reports as supported. every CPU meeting
# x86-64-v3 has it, so it stays on from v3 up.
# https://somegit.dev/ALHP/ALHP.GO/issues/302
x86-64-v3:
  cflags:
    - "-mpclmul" # https://somegit.dev/ALHP/ALHP.GO/issues/92

x86-64-v4:
  cflags:
    - "-mpclmul" # https://somegit.dev/ALHP/ALHP.GO/issues/92
