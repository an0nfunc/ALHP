arch: x86_64
repos:
  - core
  - extra

state_repo: "https://gitlab.archlinux.org/archlinux/packaging/state.git"

max_clone_retries: 100

db:
  driver: pgx
  connect_to: "postgres://username:password@localhost:5432/database_name"

basedir:
  repo: /var/lib/alhp/repo/
  work: /var/lib/alhp/workspace/
  debug: /var/lib/alhp/debug/

march:
  - x86-64-v3

blacklist:
  packages:
    - tensorflow
    - tensorflow-cuda
    - gcc
  repo:
    - testing
    - i686
    - staging
    - unstable
  lto:
    - llvm
    - rust

build:
  makej: 8
  # run each build in its own network namespace via the alhp-netns helper.
  # prevents concurrent builds from colliding on ports and stops a package's
  # check() from reaching host loopback services. also the only working kill path
  # for stall_timeout/timeout when ALHP runs unprivileged, since the build tree is
  # root-owned. requires the passt package and alhp-netns installed to
  # /usr/local/bin; see the header of alhp-netns for the sudoers entry.
  # builds also get an in-namespace nftables ruleset dropping RFC1918, link-local
  # and ULA destinations, so a package cannot reach the LAN or host services bound
  # to a bridge/second-NIC address. DNS to the host's own resolvers is allowed.
  # default: true
  network_isolation: true
  # how much memory ALHP should use
  # this will also decide how many builds will run concurrently,
  # since ALHP will try to optimise the queue for speed while not going over this limit
  memory_limit: "16gb"
  # kill a build that produces neither output nor meaningful CPU work for this long.
  # a build that is silent but busy (e.g. a long LTO link) is not affected.
  # accepts any time.ParseDuration string, "0" disables, default: 2h
  stall_timeout: "2h"
  # absolute wall-clock limit for the makechrootpkg invocation, backstop for hangs
  # that keep burning CPU. does not cover the PKGBUILD checkout before it or the
  # signing after it.
  # accepts any time.ParseDuration string, "0" disables, default: 0
  timeout: "0"

logging:
  level: INFO

housekeeping:
  # how long to wait between re-verifying package signatures of already-built packages
  # accepts any time.ParseDuration string (e.g. "24h", "12h", "30m"), default: 24h
  signature_recheck_interval: "24h"

metrics:
  port: 9568
